name: Multi-Platform PyInstaller Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: windows-latest
            artifact_name: my-app-windows
            asset_name: ladle-windows.exe
          - os: ubuntu-latest
            artifact_name: my-app-linux
            asset_name: ladle-linux
          - os: macos-latest
            artifact_name: my-app-macos
            asset_name: ladle-macos

    steps:
    - name: Check out repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.13'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install . pyinstaller

    - name: Build with PyInstaller
      run: |
        pyinstaller --onefile --name ${{ matrix.asset_name }} main.py

    - name: Upload Build Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.artifact_name }}
        path: dist/${{ matrix.asset_name }}